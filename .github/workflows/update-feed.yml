name: XML Feed Güncelle

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: xml-feed-update
  cancel-in-progress: false

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scripti çalıştır
        env:
          SOURCE_XML_URL: ${{ secrets.SOURCE_XML_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OUTPUT_PATH: feed.xml
          CACHE_PATH: cache.json
        run: python generate_xml.py

      - name: Değişiklikleri commit'le ve gönder
        if: always()
        run: |
          git config user.name "xml-proxy-bot"
          git config user.email "actions@github.com"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --mixed origin/main
            git add feed.xml cache.json
            if git diff --cached --quiet; then
              echo "Değişiklik yok, çıkılıyor."
              break
            fi
            git commit -m "Otomatik XML güncelleme"
            if git push origin HEAD:main; then
              echo "Push başarılı."
              break
            fi
            echo "Push başarısız, tekrar deneniyor... ($i/5)"
            sleep $((RANDOM % 10 + 5))
          done

      - name: feed.xml'i public repoya yayınla
        if: always()
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          PUBLISH_REPO: firastoretr/urun-feed-4baac7675bd4
        run: |
          python3 - <<'PYEOF'
          import base64, json, os, urllib.request, urllib.error
          token = os.environ["PUBLISH_TOKEN"]
          repo = os.environ["PUBLISH_REPO"]
          path = "feed.xml"
          api_url = f"https://api.github.com/repos/{repo}/contents/{path}"
          with open("feed.xml", "rb") as f:
              content_b64 = base64.b64encode(f.read()).decode("utf-8")
          headers = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json", "User-Agent": "xml-proxy-bot"}
          sha = None
          req = urllib.request.Request(api_url, headers=headers)
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  sha = json.loads(resp.read().decode("utf-8")).get("sha")
          except urllib.error.HTTPError as e:
              if e.code != 404: raise
          payload = {"message": "Otomatik feed güncelleme", "content": content_b64, "branch": "main"}
          if sha: payload["sha"] = sha
          data = json.dumps(payload).encode("utf-8")
          put_req = urllib.request.Request(api_url, data=data, headers=headers, method="PUT")
          with urllib.request.urlopen(put_req, timeout=30) as resp:
              print("Public repoya yayınlandı, HTTP", resp.status)
          PYEOF

  sync-stock:
    runs-on: ubuntu-latest
    needs: update-feed
    steps:
      - name: Repoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ikas stok senkronizasyonu
        env:
          SOURCE_XML_URL: ${{ secrets.SOURCE_XML_URL }}
          FEED_XML_URL: "https://raw.githubusercontent.com/firastoretr/urun-feed-4baac7675bd4/main/feed.xml"
          IKAS_CLIENT_ID: ${{ secrets.IKAS_CLIENT_ID }}
          IKAS_CLIENT_SECRET: ${{ secrets.IKAS_CLIENT_SECRET }}
          IKAS_STOCK_LOCATION_ID: ${{ secrets.IKAS_STOCK_LOCATION_ID }}
          MIN_STOCK: "5"
          BATCH_SIZE: "50"
          DRY_RUN: "0"
        run: python sync_stock.py

  sync-trendyol:
    runs-on: ubuntu-latest
    needs: sync-stock
    steps:
      - name: Repoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Trendyol stok senkronizasyonu
        env:
          FEED_XML_URL: "https://raw.githubusercontent.com/firastoretr/urun-feed-4baac7675bd4/main/feed.xml"
          TRENDYOL_SUPPLIER_ID: ${{ secrets.TRENDYOL_SUPPLIER_ID }}
          TRENDYOL_API_KEY: ${{ secrets.TRENDYOL_API_KEY }}
          TRENDYOL_API_SECRET: ${{ secrets.TRENDYOL_API_SECRET }}
          MIN_STOCK: "5"
          BATCH_SIZE: "100"
          DRY_RUN: "0"
        run: python sync_trendyol.py

  sync-hepsiburada:
    runs-on: ubuntu-latest
    needs: sync-stock
    steps:
      - name: Repoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Hepsiburada stok senkronizasyonu
        env:
          FEED_XML_URL: "https://raw.githubusercontent.com/firastoretr/urun-feed-4baac7675bd4/main/feed.xml"
          HEPSIBURADA_MERCHANT_ID: ${{ secrets.HEPSIBURADA_MERCHANT_ID }}
          HEPSIBURADA_API_KEY: ${{ secrets.HEPSIBURADA_API_KEY }}
          MIN_STOCK: "5"
          DRY_RUN: "1"
        run: python sync_hepsiburada.py

  sync-pazarama:
    runs-on: ubuntu-latest
    needs: sync-stock
    steps:
      - name: Repoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pazarama stok senkronizasyonu
        env:
          FEED_XML_URL: "https://raw.githubusercontent.com/firastoretr/urun-feed-4baac7675bd4/main/feed.xml"
          PAZARAMA_API_KEY: ${{ secrets.PAZARAMA_API_KEY }}
          PAZARAMA_API_SECRET: ${{ secrets.PAZARAMA_API_SECRET }}
          MIN_STOCK: "5"
          BATCH_SIZE: "100"
          DRY_RUN: "1"
        run: python sync_pazarama.py
